project:
  type: website

website:
  title: "Akash’s Blog"
  site-url: https://akashprakas.github.io/akashBlog/
  navbar:
    right:
      - text: Posts
        href: index.qmd
      - about.qmd
      - icon: github
        href: https://github.com/akashprakas
      - icon: twitter
        href: https://twitter.com/akashaapz

format:
  html:
    theme:
      light: flatly
      dark: darkly
    fontsize: 18px
    linestretch: 1.75
    css: styles.css
    toc: true
    toc-location: right
    anchor-sections: true
    code-copy: true
    code-overflow: wrap
    code-line-numbers: false
    highlight-style: atom-one
    grid:
      body-width: 820px
      margin-width: 230px
      gutter-width: 2.5rem



