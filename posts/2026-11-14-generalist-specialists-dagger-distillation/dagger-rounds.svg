<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 385" width="1000" height="385" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, sans-serif">
  <title id="title">A4-Q1 has four collection-and-training rounds</title>
  <desc id="desc">Static alternative to the schematic GIF. Exact new queries, cumulative pools and update counts come from results/data/a4/a4_Q1_final_eval.json. Counts are pairs per task, not scalar actions or episodes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#53647a" />
    </marker>
  </defs>
  <rect width="1000" height="385" fill="#f6f8fc" rx="18" />
  <text x="30" y="39" fill="#17263c" font-size="24" font-weight="700" text-anchor="start">A4-Q1: one run, four collection-and-training rounds</text>
  <text x="30" y="68" fill="#53647a" font-size="16" font-weight="400" text-anchor="start">SCHEMATIC | exact saved counts | all student runs start from A1@230k</text>
  <rect x="25" y="93" width="230" height="160" rx="14" fill="white" stroke="#d5dfe9" stroke-width="2" />
