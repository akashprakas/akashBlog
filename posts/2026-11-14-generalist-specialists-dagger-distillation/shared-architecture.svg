<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">One shared trunk, two task-specific velocity heads</title>
  <desc id="architecture-desc">Static export of explainer/src/ch03.js, with layer sizes supplied by explainer/build.py from core/models.py. The Square sample has 23 observation values padded to 53, task tag [1, 0], 28 noisy chunk values padded to 56, and 32 time features: 143 inputs to five shared 512-unit GELU layers. Only the Square head produces its 28-dimensional velocity. For Tool Hang, all 53 observation and 56 chunk slots are used, the tag is [0, 1], and only its 56-dimensional head runs. This is a network schematic, not a rollout.</desc>
  <style>:root {
  --bg: #f7f7f4; --fg: #1d2127; --muted: #5b6470; --card: #ffffff; --line: #d9dbd6; --soft: #eef0ea;
  --a1: #6b7280;      /* shared BC student, the starting point */
  --a3: #2563eb;      /* offline distillation */
  --a4: #9333ea;      /* routed DAgger */
  --ok: #0d8a7d;      /* expert, specialist, or the fix */
  --bad: #d92d20;     /* failure or a bug */
  --sel: #b45309;     /* the thing you selected */
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.05);
}
svg .t { font: 12px system-ui, sans-serif; fill: var(--fg); }
svg .tk { font-size: 11px; fill: var(--muted); }
svg .lb { font-weight: 600; }
svg .mu { fill: var(--muted); }</style>
  <rect width="800" height="480" rx="12" fill="var(--card)" />
  <text x="20" y="25" class="t lb">Square sample</text>
  <rect x="390" y="13" width="18" height="14" fill="var(--a1)" />
  <text x="415" y="25" class="t tk">real input</text>
  <rect x="535" y="13" width="18" height="14" fill="var(--card)" stroke="var(--line)" stroke-dasharray="3 2" />
  <text x="560" y="25" class="t tk">zero padding</text>
  <rect x="685" y="13" width="18" height="14" fill="var(--fg)" />
  <text x="710" y="25" class="t tk">tag = 1</text>
  <g transform="translate(0 40)">
    <g>
      <defs>
        <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0 0 L10 5 L0 10 z" style="fill: var(--muted);" />
        </marker>
      </defs>
      <g class="node">
        <text x="20" y="36" class="t lb" text-anchor="start">observation · 53 slots</text>
        <rect x="20" y="42" width="91.13207547169812" height="22" style="fill: var(--a1); stroke: var(--card); stroke-width: 0.5;" />
        <rect x="111.13207547169812" y="42" width="118.86792452830188" height="22" style="fill: var(--card); stroke: var(--line); stroke-dasharray: 3, 2;" />
        <text x="20" y="78" class="t tk" text-anchor="start">23 real + 30 zeros</text>
      </g>
      <g class="node">
        <text x="20" y="108" class="t lb" text-anchor="start">task tag · 2</text>
        <rect x="20" y="114" width="24" height="22" style="fill: var(--fg); stroke: var(--card);" />
        <rect x="44" y="114" width="24" height="22" style="fill: var(--card); stroke: var(--line); stroke-dasharray: 3, 2;" />
        <text x="76" y="130" class="t tk" text-anchor="start">[1, 0]</text>
      </g>
      <g class="node">
        <text x="20" y="168" class="t lb" text-anchor="start">noisy chunk · 56 slots</text>
        <rect x="20" y="174" width="105" height="22" style="fill: var(--a1); stroke: var(--card); stroke-width: 0.5;" />
        <rect x="125" y="174" width="105" height="22" style="fill: var(--card); stroke: var(--line); stroke-dasharray: 3, 2;" />
        <text x="20" y="210" class="t tk" text-anchor="start">28 real + 28 zeros</text>
      </g>
      <g class="node">
        <text x="20" y="238" class="t lb" text-anchor="start">time t → embedding · 32</text>
        <rect x="20" y="244" width="210" height="22" style="fill: var(--a1); stroke: var(--card); stroke-width: 0.5;" />
      </g>
      <rect x="250" y="42" width="14" height="224" rx="3" style="fill: var(--soft); stroke: var(--muted);" />
      <text x="257" y="280" class="t tk" text-anchor="middle">concat</text>
      <text x="257" y="293" class="t lb" text-anchor="middle">143</text>
      <line x1="232" x2="249" y1="53" y2="53" marker-end="url(#arr3)" style="stroke: var(--muted); stroke-width: 1.5;" />
      <line x1="232" x2="249" y1="125" y2="125" marker-end="url(#arr3)" style="stroke: var(--muted); stroke-width: 1.5;" />
      <line x1="232" x2="249" y1="185" y2="185" marker-end="url(#arr3)" style="stroke: var(--muted); stroke-width: 1.5;" />
      <line x1="232" x2="249" y1="255" y2="255" marker-end="url(#arr3)" style="stroke: var(--muted); stroke-width: 1.5;" />
      <line x1="266" x2="297" y1="143" y2="143" marker-end="url(#arr3)" style="stroke: var(--muted); stroke-width: 1.5;" />
      <g class="node">
        <text x="300" y="100" class="t lb" text-anchor="start">shared trunk · 5 × 512</text>
        <rect x="300" y="112" width="46" height="62" rx="6" style="fill: var(--a1); opacity: 0.9;" />
        <text x="323" y="140" class="t " text-anchor="middle" style="fill: rgb(255, 255, 255); font-weight: 600;">512</text>
        <text x="323" y="157" class="t " text-anchor="middle" style="fill: rgb(255, 255, 255); font-size: 10px;">GELU</text>
        <rect x="352" y="112" width="46" height="62" rx="6" style="fill: var(--a1); opacity: 0.9;" />
        <text x="375" y="140" class="t " text-anchor="middle" style="fill: rgb(255, 255, 255); font-weight: 600;">512</text>
        <text x="375" y="157" class="t " text-anchor="middle" style="fill: rgb(255, 255, 255); font-size: 10px;">GELU</text>
        <line x1="346" x2="351" y1="143" y2="143" style="stroke: var(--muted);" />
        <rect x="404" y="112" width="46" height="62" rx="6" style="fill: var(--a1); opacity: 0.9;" />
        <text x="427" y="140" class="t " text-anchor="middle" style="fill: rgb(255, 255, 255); font-weight: 600;">512</text>
        <text x="427" y="157" class="t " text-anchor="middle" style="fill: rgb(255, 255, 255); font-size: 10px;">GELU</text>
        <line x1="398" x2="403" y1="143" y2="143" style="stroke: var(--muted);" />
        <rect x="456" y="112" width="46" height="62" rx="6" style="fill: var(--a1); opacity: 0.9;" />
        <text x="479" y="140" class="t " text-anchor="middle" style="fill: rgb(255, 255, 255); font-weight: 600;">512</text>
        <text x="479" y="157" class="t " text-anchor="middle" style="fill: rgb(255, 255, 255); font-size: 10px;">GELU</text>
        <line x1="450" x2="455" y1="143" y2="143" style="stroke: var(--muted);" />
        <rect x="508" y="112" width="46" height="62" rx="6" style="fill: var(--a1); opacity: 0.9;" />
        <text x="531" y="140" class="t " text-anchor="middle" style="fill: rgb(255, 255, 255); font-weight: 600;">512</text>
        <text x="531" y="157" class="t " text-anchor="middle" style="fill: rgb(255, 255, 255); font-size: 10px;">GELU</text>
        <line x1="502" x2="507" y1="143" y2="143" style="stroke: var(--muted);" />
        <text x="300" y="192" class="t tk" text-anchor="start">used by both tasks</text>
      </g>
      <line x1="556" x2="587" y1="143" y2="90" marker-end="url(#arr3)" style="stroke: var(--muted); stroke-width: 2.5; opacity: 1;" />
      <g class="node">
        <rect x="590" y="62" width="110" height="56" rx="8" style="fill: var(--a1); stroke: var(--a1); stroke-width: 2;" />
        <text x="645" y="86" class="t lb" text-anchor="middle" style="fill: rgb(255, 255, 255);">Square head</text>
        <text x="645" y="102" class="t " text-anchor="middle" style="fill: rgb(255, 255, 255);">Dense 28</text>
      </g>
      <rect x="716" y="62" width="16" height="56" style="fill: var(--a1); stroke: var(--a1);" />
      <text x="738" y="94" class="t lb" text-anchor="start">28 ✓</text>
      <line x1="556" x2="587" y1="143" y2="244" marker-end="url(#arr3)" style="stroke: var(--muted); stroke-width: 1; opacity: 0.4; stroke-dasharray: 4, 3;" />
      <g class="node">
        <rect x="590" y="190" width="110" height="108" rx="8" style="fill: var(--card); stroke: var(--a1); stroke-width: 2; stroke-dasharray: 5, 3;" />
        <text x="645" y="240" class="t lb" text-anchor="middle" style="">Tool Hang head</text>
        <text x="645" y="256" class="t " text-anchor="middle" style="">Dense 56</text>
      </g>
      <rect x="716" y="190" width="16" height="108" style="fill: var(--card); stroke: var(--a1); stroke-dasharray: 3, 2;" />
      <text x="738" y="248" class="t tk" text-anchor="start">56</text>
      <text x="716" y="38" class="t tk" text-anchor="start">velocity</text>
      <text x="716" y="50" class="t tk" text-anchor="start">output</text>
      <text x="20" y="326" class="t lb" text-anchor="start">What the trunk receives: 143 numbers for this Square sample</text>
      <rect x="20" y="346" width="122.23776223776224" height="24" style="fill: var(--a1); stroke: var(--card); stroke-width: 0.5;" />
      <rect x="142.23776223776224" y="346" width="159.44055944055944" height="24" style="fill: var(--card); stroke: var(--line); stroke-dasharray: 3, 2;" />
      <rect x="301.6783216783217" y="346" width="5.314685314685315" height="24" style="fill: var(--fg); stroke: var(--card);" />
      <rect x="306.99300699300704" y="346" width="5.314685314685315" height="24" style="fill: var(--card); stroke: var(--line); stroke-dasharray: 3, 2;" />
