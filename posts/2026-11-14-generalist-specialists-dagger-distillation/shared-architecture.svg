      <text x="160.83916083916083" y="398" class="t tk" text-anchor="middle">obs 53</text>
      <path d="M301.67832167832165 378V383H311.3076923076923V378" style="fill: none; stroke: var(--muted);" />
      <text x="306.993006993007" y="398" class="t tk" text-anchor="middle">tag 2</text>
      <path d="M312.3076923076923 378V383H608.93006993007V378" style="fill: none; stroke: var(--muted);" />
      <text x="461.1188811188812" y="398" class="t tk" text-anchor="middle">chunk 56</text>
      <path d="M609.93006993007 378V383H779V378" style="fill: none; stroke: var(--muted);" />
      <text x="694.965034965035" y="398" class="t tk" text-anchor="middle">time 32</text>
      <text x="20" y="424" class="t mu" text-anchor="start">58 of the 143 numbers are zero padding</text>
