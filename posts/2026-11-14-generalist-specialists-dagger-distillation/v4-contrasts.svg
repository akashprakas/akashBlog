  <title id="title">Ten-seed paired SDE contrasts (Q3 v4)</title>
  <desc id="desc">Paired Student-t 95% confidence intervals (n=10 seeds, df=9) and individual replication differences for DAgger minus staged offline, DAgger minus upfront offline, and staged minus upfront offline across the two-task average, Square MH, and Tool Hang PH.</desc>
